# Fly.io configuration for Rust WebSocket Chat
# See: https://fly.io/docs/reference/configuration/

app = "rust-websocket-chat"
primary_region = "nrt"  # Tokyo region (closest to India with good latency)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # WebSocket support: Fly.io supports WebSockets by default
  # The http_service handles both HTTP and WS upgrade requests

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
