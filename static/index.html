<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust WebSocket Chat</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>"
    />
  </head>
  <body>
    <!-- ===== Join Screen ===== -->
    <div id="join-screen" class="screen">
      <div class="join-card">
        <div class="logo">💬</div>
        <h1>Rust WebSocket Chat</h1>
        <p class="subtitle">Multi-room · Direct Messages · Reconnection</p>
        <form id="join-form">
          <input
            type="text"
            id="username-input"
            placeholder="Enter a username"
            autocomplete="off"
            maxlength="20"
            required
          />
          <button type="submit">Join Chat</button>
        </form>
        <p class="hint">
          Open another tab and join with a different name to test rooms, DMs,
          and typing indicators.
        </p>
      </div>
    </div>

    <!-- ===== Chat Screen ===== -->
    <div id="chat-screen" class="screen hidden">
      <!-- Left sidebar: rooms + online users -->
      <aside class="sidebar-left">
        <div class="sidebar-header">
          <span class="logo-small">💬</span>
          <span class="brand-name">Rust WS Chat</span>
        </div>

        <!-- Rooms section -->
        <div class="sidebar-section">
          <h3>Rooms</h3>
          <ul id="room-list" class="room-list"></ul>
        </div>

        <!-- Online users section -->
        <div class="sidebar-section">
          <h3>Online (<span id="online-count">0</span>)</h3>
          <ul id="online-list" class="online-list"></ul>
        </div>

        <!-- Connection status -->
        <div class="sidebar-footer">
          <div class="conn-status">
            <span id="conn-dot" class="dot dot-offline"></span>
            <span id="conn-text">disconnected</span>
          </div>
          <button id="leave-btn" class="btn-leave">Leave</button>
        </div>
      </aside>

      <!-- Main chat area -->
      <main class="chat-main">
        <!-- DM tabs bar (hidden when in room mode) -->
        <div id="dm-bar" class="dm-bar hidden">
          <button id="dm-back-btn" class="dm-back">← Back to room</button>
          <span id="dm-peer-name" class="dm-peer-name"></span>
        </div>

        <!-- Room header (hidden when in DM mode) -->
        <header id="room-header" class="room-header">
          <span id="current-room-name" class="room-name">#general</span>
          <span id="room-typing" class="room-typing"></span>
        </header>

        <!-- Messages area -->
        <div id="messages" class="messages" aria-live="polite"></div>

        <!-- Typing indicator bar -->
        <div id="typing-bar" class="typing-bar hidden">
          <span class="typing-dots"><span></span><span></span><span></span></span>
          <span id="typing-text"></span>
        </div>

        <!-- Reconnection banner -->
        <div id="reconnect-banner" class="reconnect-banner hidden">
          <span class="spinner"></span>
          <span id="reconnect-text">Reconnecting…</span>
        </div>

        <!-- Message composer -->
        <form id="msg-form" class="composer">
          <input
            type="text"
            id="msg-input"
            placeholder="Type a message and press Enter…"
            autocomplete="off"
            maxlength="500"
            disabled
          />
          <button type="submit" id="send-btn" disabled>Send</button>
        </form>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
